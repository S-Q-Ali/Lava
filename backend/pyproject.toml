[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lava-backend"
version = "0.1.0-beta.0"
description = "Lava Studio local media sidecar: FFmpeg probe and render over HTTP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "onnxruntime==1.17.3 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
  "onnxruntime>=1.17.3,<2 ; sys_platform == 'win32'",
  "faster-whisper>=1.2.1",
  "numpy<2",
  "pillow>=12.3.0",
  "opencv-python-headless>=4.9,<5",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lava_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
