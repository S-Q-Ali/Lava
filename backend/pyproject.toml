[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lava-backend"
version = "0.1.0"
description = "Lava Studio local media sidecar: FFmpeg probe and render over HTTP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lava_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"